[project]
name = "farm-microgrid-research"
version = "0.1.0"
description = "Hourly simulation of a small off-grid farm microgrid, and capacity estimation from field battery data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
field = ["numpy>=1.26", "polars>=1.0"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/farmsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"experiments/*" = ["E402"]
"field_capacity/*" = ["E501", "E741", "B007"]  # exploratory analysis scripts: long report lines
